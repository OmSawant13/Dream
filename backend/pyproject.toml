[project]
name = "friday-tony-stark-demo"
version = "0.1.0"
description = "Friday — A Tony Stark-inspired MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "httpx",
    "livekit-agents[deepgram,groq,openai,sarvam,silero]>=1.5.1",
    "livekit-plugins-google>=1.5.1",
    "python-dotenv",
    "psutil",
    "pyserial>=3.5",
    "paho-mqtt>=2.1.0",
    "bleak>=3.0.1",
    "pyfirmata>=1.1.0",
    "opencv-python-headless>=4.13.0.92",
    "mediapipe>=0.10.33",
    "zeroconf>=0.148.0",
    "python-pptx>=1.0.2",
    "pandas>=3.0.2",
    "openpyxl>=3.1.5",
    "fpdf2>=2.8.7",
    "pyautogui>=0.9.54",
    "py-applescript>=1.0.3",
    "yfinance>=1.3.0",
    "selenium>=4.43.0",
    "beautifulsoup4>=4.14.3",
    "speedtest-cli>=2.1.3",
    "scikit-learn>=1.8.0",
    "pygithub>=2.9.1",
    "cryptography>=46.0.6",
    "librosa>=0.11.0",
    "google-generativeai>=0.8.6",
    "ollama>=0.6.1",
    "pyobjc-core>=12.1",
    "pyobjc>=12.1",
    "speechrecognition>=3.16.0",
    "pyaudio>=0.2.14",
    "pyperclip>=1.11.0",
    "websockets>=15.0",
]

[project.scripts]
friday = "server:main"
friday_voice = "agent_friday:dev" # Points to the wrapper

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server.py"]
