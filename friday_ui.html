<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F.R.I.D.A.Y. — Voice Interface</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root { --blue: #00d4ff; --blue-dim: #004466; --gold: #ff9f1a; --bg: #06080f; --glass: rgba(0,212,255,0.04); --glass-border: rgba(0,212,255,0.12); }
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { background: var(--bg); color: #c8dce8; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
body::before { content: ''; position: fixed; inset: 0; z-index: 0; background-image: linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px); background-size: 60px 60px; }
.app { position: relative; z-index: 1; text-align: center; width: 100%; max-width: 600px; }
.reactor-wrap { position: relative; width: 200px; height: 200px; margin: 0 auto 32px; cursor: pointer; }
.reactor-core { position: absolute; inset: 45px; border-radius: 50%; background: radial-gradient(circle, #00d4ff, #004466, transparent); box-shadow: 0 0 40px var(--blue-dim); transition: all 0.5s ease; }
.reactor-ring { position: absolute; border-radius: 50%; border: 1.5px solid rgba(0,212,255,0.15); animation: spin 10s linear infinite; inset: 0; }
.ring-2 { inset: 20px; border-style: dashed; animation-duration: 6s; animation-direction: reverse; }
.reactor-wrap.listening .reactor-core { background: radial-gradient(circle, #00d4ff, #0064c8); box-shadow: 0 0 60px #00d4ff; }
.reactor-wrap.thinking .reactor-core { background: radial-gradient(circle, #ff9f1a, #ff7800); box-shadow: 0 0 60px #ff9f1a; }
.reactor-wrap.speaking .reactor-core { background: radial-gradient(circle, #00ffa0, #00c878); box-shadow: 0 0 60px #00ffa0; }
@keyframes spin { to { transform: rotate(360deg); } }
.status { font-family: 'Orbitron', monospace; font-size: 13px; letter-spacing: 3px; margin-bottom: 8px; color: #335566; text-transform: uppercase; }
.status.listening { color: var(--blue); }
.status.thinking { color: var(--gold); }
.status.speaking { color: #00ffa0; }
.transcript { font-size: 15px; color: rgba(0,212,255,0.6); min-height: 24px; font-style: italic; margin-bottom: 24px; }
.chat-box { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 16px; backdrop-filter: blur(12px); height: 200px; overflow-y: auto; padding: 16px; text-align: left; }
.msg { padding: 10px 14px; border-radius: 12px; margin-bottom: 8px; font-size: 13px; animation: fadeIn 0.3s ease; line-height: 1.4; }
.msg.user { background: rgba(0,212,255,0.08); margin-left: auto; color: var(--blue); }
.msg.friday { background: rgba(255,255,255,0.03); color: #9ab8c8; }
#debug { font-family:monospace; font-size:9px; color:#223344; text-align:left; padding:10px; margin-top:10px; max-height:60px; overflow-y:auto; border-top:1px solid #112233; width: 100%; }
</style>
</head>
<body>
<div class="app">
  <div class="reactor-wrap sleeping" id="reactor" onclick="forceWake()">
    <div class="reactor-ring ring-1"></div>
    <div class="reactor-ring ring-2"></div>
    <div class="reactor-core"></div>
  </div>
  <div class="status sleeping" id="status">SAY "FRIDAY" TO WAKE</div>
  <div class="transcript" id="transcript"></div>
  <div class="chat-box" id="chat"></div>
  <div id="debug">System Initialized.</div>
</div>

<script>
let state = 'sleeping';
const reactor = document.getElementById('reactor');
const statusEl = document.getElementById('status');
const transcriptEl = document.getElementById('transcript');
const chatEl = document.getElementById('chat');

function debug(msg) { document.getElementById('debug').innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${msg}`; document.getElementById('debug').scrollTop = 9999; }

function setState(s) {
  state = s;
  reactor.className = 'reactor-wrap ' + s;
  statusEl.className = 'status ' + s;
  statusEl.textContent = (s==='sleeping'?'SAY "FRIDAY" TO WAKE':(s==='listening'?'LISTENING':(s==='thinking'?'PROCESSING':'RESPONDING')));
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div style="font-size:8px; opacity:0.4; font-family:Orbitron">${role==='user'?'BOSS':'FRIDAY'}</div>${text}`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

let ws = new WebSocket('ws://localhost:9090');
ws.onmessage = (e) => {
  const data = JSON.parse(e.data);
  if (data.type === 'response') { addMessage('friday', data.text); speak(data.text); }
};

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isLocked = false;

function startEar() {
  if (isLocked) return;
  if (recognition) { try { recognition.abort(); } catch(e){} }
  recognition = new SpeechRecognition();
  recognition.continuous = (state === 'sleeping');
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onstart = () => { isLocked = false; debug("Mic ready ("+state+")"); };
  recognition.onend = () => { if (!isLocked) setTimeout(startEar, 400); };
  
  recognition.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    
    if (state === 'sleeping') {
      if ((final + interim).toLowerCase().includes('friday')) {
        debug("Wake word triggered.");
        isLocked = false; setState('listening'); recognition.stop();
      }
    } else if (state === 'listening') {
      transcriptEl.textContent = interim || final;
      if (final) {
        // Echo Filter: Strip "Friday" and ignore if empty
        const cmd = final.toLowerCase().replace(/friday/g, '').trim();
        if (cmd.length < 2) { debug("Echo ignored."); startEar(); return; }
        
        debug("Command: " + cmd);
        addMessage('user', final);
        isLocked = true; setState('thinking');
        ws.send(JSON.stringify({ type: 'command', text: final }));
        recognition.stop();
      }
    }
  };
  try { recognition.start(); } catch(e){}
}

function forceWake() { if (state === 'sleeping') { isLocked = true; setState('listening'); startEar(); } }

function speak(text) {
  isLocked = true; setState('speaking');
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const voices = speechSynthesis.getVoices();
  const v = voices.find(v => v.name.includes('Samantha') || v.name.includes('Karen'));
  if (v) utter.voice = v;
  utter.onend = () => { isLocked = false; setState('sleeping'); transcriptEl.textContent = ''; startEar(); };
  speechSynthesis.speak(utter);
}

speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
startEar();
</script>
</body>
</html>
